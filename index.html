<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>My Agenda</h2>
        <div class="input-area">
            <input id="taskInput" type="text" placeholder="Tulis Agenda Kamu Disini">
            <button id="addButton" class="add-button">Submit</button>
        </div>
        <ul id="taskList" class="list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
